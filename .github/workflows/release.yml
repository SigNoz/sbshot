name: release

on:
  push:
    branches:
      - main

# Releases queue up instead of cancelling each other.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # npm trusted publishing authenticates through OIDC, so there is no npm token.
    # The trusted publisher on npmjs.com names this file, release.yml, and no environment.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: self-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later. The latest Node 24 ships a newer npm.
      - name: node-install
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # There is no build step: the package is the source files listed in `files`.
      - name: publish
        run: npm publish
        env:
          NPM_CONFIG_PROVENANCE: true
