name: jsci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: self-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install-pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: node-install
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The export test encodes WebP with ImageMagick, and skips without it.
      - name: install-imagemagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: install
        run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm run test
  fmt:
    # Primus needs org secrets, which pull_request withholds from forks and dependabot.
    if: github.event_name == 'push' || (! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      contents: read
      id-token: write
    uses: signoz/primus.workflows/.github/workflows/js-fmt.yaml@main
    secrets: inherit
    with:
      PRIMUS_REF: main
      JS_SRC: .
      JS_PKG_MANAGER: pnpm
      # Same pnpm version as test and publint. package.json has no packageManager field,
      # because primus runs setup-node before pnpm and setup-node then fails to find pnpm.
      PNPM_VERSION: 10.34.5
  lint:
    # Primus needs org secrets, which pull_request withholds from forks and dependabot.
    if: github.event_name == 'push' || (! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      contents: read
      id-token: write
    uses: signoz/primus.workflows/.github/workflows/js-lint.yaml@main
    secrets: inherit
    with:
      PRIMUS_REF: main
      JS_SRC: .
      JS_PKG_MANAGER: pnpm
      # Same pnpm version as test and publint. package.json has no packageManager field,
      # because primus runs setup-node before pnpm and setup-node then fails to find pnpm.
      PNPM_VERSION: 10.34.5
  publint:
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install-pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: node-install
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: publint
        run: pnpm run publint
